services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_ledger
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5433:5432"
    volumes:
      - banking_ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    # The app runs Flyway on startup, so it must not connect before Postgres
    # accepts connections.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_ledger
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      # Local stack signs and verifies its own tokens so it runs without an
      # identity provider. Point the service at a real one by replacing this with
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI; setting both is
      # rejected at startup.
      BANKING_DEV_JWT_SECRET: local-development-only-secret-do-not-deploy
    ports:
      - "8080:8080"
    restart: on-failure

  # Not started by a plain `docker compose up`; bring it up with
  # `docker compose --profile observability up` when you want the alerts
  # evaluated locally.
  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observability
    depends_on:
      - app
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  banking_ledger_data:
  prometheus_data:
