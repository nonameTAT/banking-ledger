services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_ledger
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5433:5432"
    volumes:
      - banking_ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    # The app runs Flyway on startup, so it must not connect before Postgres
    # accepts connections.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_ledger
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      # Tokens come from Keycloak. Every token must carry the public issuer,
      # while the signing keys are fetched from Keycloak over the internal
      # network, and the token must be issued for the API client. The app does
      # not wait for Keycloak: it fetches the keys when the first token arrives.
      # compose.dev-token.yaml replaces all three with locally signed tokens.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${BANKING_AUTH_URL:-https://auth.example.com}/realms/banking
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: banking-ledger-api
    ports:
      - "8080:8080"
    restart: on-failure

  # Creates Keycloak's database and user in the shared PostgreSQL instance if
  # they are missing, then exits. It runs on every start, so an existing ledger
  # volume gets them too.
  keycloak-db:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/opt/keycloak-db/create-database.sh"]
    environment:
      PGHOST: postgres
      PGUSER: banking
      PGPASSWORD: banking
      PGDATABASE: banking_ledger
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./ops/keycloak/create-database.sh:/opt/keycloak-db/create-database.sh:ro
    restart: "no"

  # The only token issuer outside backend-only development. It publishes no host
  # port: browsers reach it through nginx at the public auth URL (#30), and the
  # app reaches it at keycloak:8080. The realm, clients, roles and mappers are
  # imported from ops/keycloak/realm-export.json on first start; it holds no
  # users. scripts/seed-demo-users.sh adds demo users for development.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Fixes every URL Keycloak generates, and so the iss claim the app checks.
      KC_HOSTNAME: ${BANKING_AUTH_URL:-https://auth.example.com}
      # nginx terminates TLS and forwards the original host and scheme.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # A temporary administrator for the master realm, created only while it
      # has none. Override both for anything but local development.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Substituted into realm-export.json for the web app's exact redirect URI
      # and allowed origin.
      BANKING_APP_URL: ${BANKING_APP_URL:-https://app.example.com}
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # Healthy means the banking realm answers, not just that Keycloak runs:
      # Keycloak reports itself ready before it has imported the realm, and
      # anything started after `docker compose up --wait` needs the realm. The
      # image has no curl, so the request goes over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /realms/banking HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure

  # Not started by a plain `docker compose up`; bring it up with
  # `docker compose --profile observability up` when you want the alerts
  # evaluated locally.
  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observability
    depends_on:
      - app
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  banking_ledger_data:
  prometheus_data:
