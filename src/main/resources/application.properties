spring.application.name=banking-ledger
spring.datasource.url=jdbc:postgresql://localhost:5433/banking_ledger
spring.datasource.username=banking
spring.datasource.password=banking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Tokens come from Keycloak. Each environment sets, usually as environment
# variables:
#   spring.security.oauth2.resourceserver.jwt.issuer-uri   the public issuer
#   spring.security.oauth2.resourceserver.jwt.jwk-set-uri  Keycloak's internal JWKS
#   spring.security.oauth2.resourceserver.jwt.audiences    the API client id
# They are deliberately not given empty defaults here: Spring Boot treats an
# empty value as configured. Without them the app refuses to start, unless the
# "dev" profile (application-dev.properties) supplies locally signed tokens.
#
# Keycloak's mapper puts the caller's roles on the API client into this
# top-level claim, so the role ledger:admin becomes SCOPE_ledger:admin.
banking.security.authorities-claim=ledger_roles

# Every request gets a trace, not a sample of them: the id is used to find a
# specific call's log lines, which only works if every call has one.
management.tracing.sampling.probability=1.0

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Reconciliation compares stored balances against the entries behind them.
# The first run waits until the application has settled; later runs follow the
# interval. Durations are ISO-8601.
banking.reconciliation.scheduled=true
banking.reconciliation.initial-delay=PT1M
banking.reconciliation.interval=PT5M

# Bounds on how long anything is allowed to wait. Without these a database that
# has stopped answering does not fail requests, it holds their threads, and the
# service stops serving the endpoints that do not need a database either.
#
# The three bounds nest deliberately, innermost first:
#   connection-timeout  how long a request waits for a pooled connection
#   default-timeout     how long a transaction may run before it is rolled back
#   statement_timeout   a backstop in the database for a runaway query
# Each is longer than the one before, so a request fails at the layer that knows
# most about what went wrong rather than at the blunt outer one.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.maximum-pool-size=20

spring.transaction.default-timeout=10s

# Applied to every connection by the driver. This is the last line of defence,
# so it is set above the slowest legitimate query rather than near the typical
# one; reconciliation scans every account and is the query that defines it.
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=${BANKING_STATEMENT_TIMEOUT_MS:30000}

# Reconciliation is a batch scan, not a request, so it is allowed longer than
# the default transaction timeout. It remains capped by statement_timeout above.
banking.reconciliation.transaction-timeout=60
