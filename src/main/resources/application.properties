spring.application.name=banking-ledger
spring.datasource.url=jdbc:postgresql://localhost:5433/banking_ledger
spring.datasource.username=banking
spring.datasource.password=banking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Local development signs its own tokens so the stack runs without an identity
# provider. A deployment sets spring.security.oauth2.resourceserver.jwt.issuer-uri
# instead, and must clear this value: configuring both is rejected at startup.
banking.security.dev-jwt-secret=${BANKING_DEV_JWT_SECRET:local-development-only-secret-do-not-deploy}
