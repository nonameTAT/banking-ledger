# Backend-only development: the app verifies tokens signed with a shared secret,
# minted by scripts/dev-token.sh, so it runs without an identity provider.
#
# Nothing activates this profile by default, and no deployed environment may.
# Anyone holding the secret can mint a token for any account, administrators
# included. Setting identity provider properties next to it is refused at
# startup.
banking.security.dev-jwt-secret=${BANKING_DEV_JWT_SECRET:local-development-only-secret-do-not-deploy}

# scripts/dev-token.sh puts permissions in the OAuth2 scope claim.
banking.security.authorities-claim=scope
