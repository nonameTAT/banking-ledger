<svg xmlns='http://www.w3.org/2000/svg' width='760' height='300' viewBox='0 0 760 300' role='img' aria-label='The limit is the write path, not the machine'><title>The limit is the write path, not the machine</title><desc>At 50 concurrent clients the read-only shape sustains about eight times the throughput of the write mix, at roughly a tenth of the p95 latency.</desc><rect width='760' height='300' fill='#1a1a19'/><text x='40.0' y='30.0' fill='#ffffff' font-size='16' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>The limit is the write path, not the machine</text><text x='40.0' y='50.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>The same shape at 50 concurrent clients with the writes removed. Reads are not bounded by CPU, the</text><text x='40.0' y='66.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>connection pool or the network - every deposit and withdrawal takes a row lock on the one system cash</text><text x='40.0' y='82.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>account, which serialises cash movement service-wide. Each bar spans the two passes.</text><text x='40.0' y='116.0' fill='#ffffff' font-size='13' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>Throughput (requests per second)</text><line x1='40.0' y1='136.0' x2='40.0' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='40.0' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>0</text><line x1='107.5' y1='136.0' x2='107.5' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='107.5' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>1,750</text><line x1='175.0' y1='136.0' x2='175.0' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='175.0' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>3,500</text><line x1='242.5' y1='136.0' x2='242.5' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='242.5' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>5,250</text><line x1='310.0' y1='136.0' x2='310.0' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='310.0' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>7,000</text><path d='M40.0,144.0 L70.3,144.0 Q74.3,144.0 74.3,148.0 L74.3,168.0 Q74.3,172.0 70.3,172.0 L40.0,172.0 Z' fill='#3987e5'/><rect x='71.0' y='144.0' width='3.2' height='28' fill='#1a1a19' opacity='0.45'/><text x='40.0' y='136.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>Write mix</text><text x='84.3' y='162.0' fill='#ffffff' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start' font-variant-numeric='tabular-nums'>805-889</text><path d='M40.0,206.0 L278.7,206.0 Q282.7,206.0 282.7,210.0 L282.7,230.0 Q282.7,234.0 278.7,234.0 L40.0,234.0 Z' fill='#3987e5'/><rect x='279.2' y='206.0' width='3.5' height='28' fill='#1a1a19' opacity='0.45'/><text x='40.0' y='198.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>Reads only</text><text x='292.7' y='224.0' fill='#ffffff' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start' font-variant-numeric='tabular-nums'>6,201-6,291</text><line x1='40.0' y1='136.0' x2='40.0' y2='242.0' stroke='#383835' stroke-width='1'/><text x='430.0' y='116.0' fill='#ffffff' font-size='13' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>p95 latency (milliseconds)</text><line x1='430.0' y1='136.0' x2='430.0' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='430.0' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>0</text><line x1='492.5' y1='136.0' x2='492.5' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='492.5' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>50</text><line x1='555.0' y1='136.0' x2='555.0' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='555.0' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>100</text><line x1='617.5' y1='136.0' x2='617.5' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='617.5' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>150</text><line x1='680.0' y1='136.0' x2='680.0' y2='242.0' stroke='#2c2c2a' stroke-width='1'/><text x='680.0' y='260.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>200</text><path d='M430.0,144.0 L618.8,144.0 Q622.8,144.0 622.8,148.0 L622.8,168.0 Q622.8,172.0 618.8,172.0 L430.0,172.0 Z' fill='#3987e5'/><rect x='604.4' y='144.0' width='18.4' height='28' fill='#1a1a19' opacity='0.45'/><text x='430.0' y='136.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>Write mix</text><text x='632.8' y='162.0' fill='#ffffff' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start' font-variant-numeric='tabular-nums'>139.5-154.2</text><path d='M430.0,206.0 L442.6,206.0 Q446.6,206.0 446.6,210.0 L446.6,230.0 Q446.6,234.0 442.6,234.0 L430.0,234.0 Z' fill='#3987e5'/><text x='430.0' y='198.0' fill='#c3c2b7' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>Reads only</text><text x='456.6' y='224.0' fill='#ffffff' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start' font-variant-numeric='tabular-nums'>13.3</text><line x1='430.0' y1='136.0' x2='430.0' y2='242.0' stroke='#383835' stroke-width='1'/></svg>
