<svg xmlns='http://www.w3.org/2000/svg' width='760' height='520' viewBox='0 0 760 520' role='img' aria-label='The write path is saturated at 5 concurrent clients'><title>The write path is saturated at 5 concurrent clients</title><desc>Two panels sharing a concurrency axis. Upper: throughput per second, flat between roughly 700 and 800 from 5 to 100 concurrent clients. Lower: median, p95 and p99 latency, each rising in proportion to the clients added.</desc><rect width='760' height='520' fill='#fcfcfb'/><text x='62.0' y='30.0' fill='#0b0b0b' font-size='16' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>The write path is saturated at 5 concurrent clients</text><text x='62.0' y='50.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>Throughput stays flat while latency rises in proportion to the clients added: work in equals work</text><text x='62.0' y='66.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>out, and everything extra is spent waiting. Both passes are plotted; neither is averaged away.</text><text x='62.0' y='92.0' fill='#0b0b0b' font-size='13' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>Throughput (requests per second)</text><line x1='62.0' y1='242.0' x2='664.0' y2='242.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='246.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>0</text><line x1='62.0' y1='208.0' x2='664.0' y2='208.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='212.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>250</text><lin