<svg xmlns='http://www.w3.org/2000/svg' width='760' height='392' viewBox='0 0 760 392' role='img' aria-label='Read throughput falls in proportion to the account&#39;s history'><title>Read throughput falls in proportion to the account&#39;s history</title><desc>Four columns at 50 concurrent clients: 6,291 requests per second against an empty account, falling to 653 against an account holding 35,065 ledger entries.</desc><rect width='760' height='392' fill='#fcfcfb'/><text x='62.0' y='30.0' fill='#0b0b0b' font-size='16' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>Read throughput falls in proportion to the account&#39;s history</text><text x='62.0' y='50.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>Same endpoints, same concurrency, empty ledger each time - only the account&#39;s entry count varies.</text><text x='62.0' y='66.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>A page of 20 entries costs a count of every row behind it, so a tenfold longer history costs about</text><text x='62.0' y='82.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='start'>a tenfold drop. Entries are append-only, so for an active account this only ever gets worse.</text><text x='62.0' y='112.0' fill='#0b0b0b' font-size='13' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='start'>Requests per second, 50 concurrent clients</text><line x1='62.0' y1='318.0' x2='720.0' y2='318.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='322.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>0</text><line x1='62.0' y1='272.0' x2='720.0' y2='272.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='276.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>1,750</text><line x1='62.0' y1='226.0' x2='720.0' y2='226.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='230.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>3,500</text><line x1='62.0' y1='180.0' x2='720.0' y2='180.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='184.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>5,250</text><line x1='62.0' y1='134.0' x2='720.0' y2='134.0' stroke='#e1e0d9' stroke-width='1'/><text x='52.0' y='138.0' fill='#898781' font-size='11' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='end' font-variant-numeric='tabular-nums'>7,000</text><path d='M132.2,318.0 L132.2,156.6 Q132.2,152.6 136.2,152.6 L152.2,152.6 Q156.2,152.6 156.2,156.6 L156.2,318.0 Z' fill='#2a78d6'/><text x='144.2' y='140.6' fill='#0b0b0b' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='middle' font-variant-numeric='tabular-nums'>6,291</text><text x='144.2' y='338.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>0</text><path d='M296.8,318.0 L296.8,267.4 Q296.8,263.4 300.8,263.4 L316.8,263.4 Q320.8,263.4 320.8,267.4 L320.8,318.0 Z' fill='#2a78d6'/><text x='308.8' y='251.4' fill='#0b0b0b' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='middle' font-variant-numeric='tabular-nums'>2,077</text><text x='308.8' y='338.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>3,045</text><path d='M461.2,318.0 L461.2,296.1 Q461.2,292.1 465.2,292.1 L481.2,292.1 Q485.2,292.1 485.2,296.1 L485.2,318.0 Z' fill='#2a78d6'/><text x='473.2' y='280.1' fill='#0b0b0b' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='middle' font-variant-numeric='tabular-nums'>985</text><text x='473.2' y='338.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>8,409</text><path d='M625.8,318.0 L625.8,304.8 Q625.8,300.8 629.8,300.8 L645.8,300.8 Q649.8,300.8 649.8,304.8 L649.8,318.0 Z' fill='#2a78d6'/><text x='637.8' y='288.8' fill='#0b0b0b' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='600' text-anchor='middle' font-variant-numeric='tabular-nums'>653</text><text x='637.8' y='338.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle' font-variant-numeric='tabular-nums'>35,065</text><line x1='62.0' y1='318.0' x2='720.0' y2='318.0' stroke='#c3c2b7' stroke-width='1'/><text x='391.0' y='380.0' fill='#52514e' font-size='12' font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight='400' text-anchor='middle'>Ledger entries on the account being read</text></svg>
