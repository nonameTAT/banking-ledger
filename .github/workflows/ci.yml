name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      # Integration tests start their own PostgreSQL container through
      # Testcontainers, using the Docker daemon preinstalled on the runner.
      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built and loaded locally only. Publishing to a registry needs
      # credentials and is deliberately left out.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: banking-ledger:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image
        run: docker image inspect banking-ledger:${{ github.sha }} --format 'built {{.RepoTags}} ({{.Size}} bytes)'
